<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vietnam Trip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');

  /* Tokens (Phú Quốc coastal: sand, sea teal, coral, palm) */
  :root{
    --paper:#F6EFE4; --surface:#FFFCF7; --ink:#14262A; --ink-soft:#4F6266; --line:#E4DACB; --lacquer:#AD412A; --lacquer-soft:#F8E0D6; --jade:#397145; --jade-soft:#DFEBDD; --gold:#885D11; --gold-soft:#F2E4C4; --focus:#2B6CB0; --brand:#0F6E7A; --brand-soft:#D9ECEC; --wood:#6B5A45; --wood-soft:#ECE3D6;
    --c-hn:#AD412A; --c-pq:#0F6E7A; --c-sg:#885D11;
    /* Map: tiles stay light in both themes, so these do not flip in dark */
    --map-surface:#FFFCF7; --map-ink:#14262A; --map-ink-soft:#4F6266; --map-line:#E4DACB; --map-neutral:#9AA8A6; --map-brand:#0F6E7A; --map-gold:#885D11; --map-lacquer:#AD412A; --map-lacquer-soft:#F8E0D6; --map-wood:#6B5A45; --map-palm:#1F5C4C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0E1B1E; --surface:#152629; --ink:#EAF2F0; --ink-soft:#A9BFBF; --line:#2A3E41; --lacquer:#F0907A; --lacquer-soft:#3A2420; --jade:#8CCB97; --jade-soft:#1C2E22; --gold:#E2BC6E; --gold-soft:#352A16; --focus:#7CB3EC; --brand:#6FC7CF; --brand-soft:#143238; --wood:#CDB08C; --wood-soft:#2E271E;
      --c-hn:#F0907A; --c-pq:#6FC7CF; --c-sg:#E2BC6E;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0E1B1E; --surface:#152629; --ink:#EAF2F0; --ink-soft:#A9BFBF; --line:#2A3E41; --lacquer:#F0907A; --lacquer-soft:#3A2420; --jade:#8CCB97; --jade-soft:#1C2E22; --gold:#E2BC6E; --gold-soft:#352A16; --focus:#7CB3EC; --brand:#6FC7CF; --brand-soft:#143238; --wood:#CDB08C; --wood-soft:#2E271E;
    --c-hn:#F0907A; --c-pq:#6FC7CF; --c-sg:#E2BC6E;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro', system-ui, sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .wrap{max-width:760px;margin-inline:auto;padding-inline:16px;}
  h1,h2,h3{font-family:'Literata', Georgia, serif;line-height:1.15;text-wrap:balance;margin:0;}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .ic{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  [hidden]{display:none !important;}

  nav.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  nav.top .wrap{display:flex;align-items:center;gap:8px;padding-block:10px;min-height:52px;}
  nav.top .brand{font-family:'Literata', Georgia, serif;font-weight:600;font-size:16px;}
  nav.top .share{margin-left:auto;}

  header.page{padding-block:28px 6px;}
  header.page .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600;}
  header.page h1{font-size:clamp(1.8rem, 5vw, 2.4rem);font-weight:600;margin-block:6px;}
  header.page p{margin:0;color:var(--ink-soft);font-size:15px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 10px;margin-bottom:20px;}
  .sec-h{font-size:1.2rem;font-weight:600;margin:0 0 4px;}
  .sec-sub{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);}

  /* Buttons */
  .act{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--brand);font:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;}
  .act:hover{border-color:var(--brand);background:var(--brand-soft);}
  .act:disabled{opacity:.4;cursor:default;}
  .btn{border:none;border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;font-weight:700;background:var(--brand);color:var(--surface);cursor:pointer;min-height:40px;}
  .btn:disabled{opacity:.4;cursor:default;}
  .ev-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .copy-btn .done{display:none;}
  .copy-btn.copied{background:var(--brand);border-color:var(--brand);color:var(--surface);}
  .copy-btn.copied .lbl{display:none;}
  .copy-btn.copied .done{display:inline;}

  /* Unlock */
  .unlock-card{border-top:4px solid var(--brand);margin-top:18px;}
  .unlock{display:flex;flex-direction:column;gap:8px;padding:2px 0 10px;font-size:14px;color:var(--ink-soft);}
  .unlock .lock-title{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);}
  .unlock-row{display:flex;gap:8px;}
  .unlock input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);}
  .unlock-msg{font-size:13px;color:var(--lacquer);min-height:1.2em;}

  /* View tabs */
  .view-tabs{position:sticky;top:52px;z-index:5;display:flex;gap:4px;background:color-mix(in srgb, var(--paper) 94%, transparent);backdrop-filter:blur(6px);padding:8px 0;margin:10px 0 4px;}
  .view-tabs button{flex:1;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;font-weight:700;padding:10px 6px;border-radius:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .view-tabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface);}
  .view-tabs .tab-help{flex:0 0 44px;padding:10px 0;font-size:16px;color:var(--brand);}
  .view-panel{margin-top:12px;}
  @media (max-width:420px){ .view-tabs .tic{display:none;} .view-tabs button{font-size:13px;padding:9px 2px;} .view-tabs .tab-help{flex-basis:38px;} }

  /* Trip strip: 17 Dec - 2 Jan, one cell per day, coloured by city */
  .strip{display:grid;grid-template-columns:repeat(17, 1fr);gap:2px;margin:6px 0 4px;}
  .strip .cell{height:30px;border-radius:5px;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .strip .cell.c-hn{background:var(--c-hn);color:var(--surface);} .strip .cell.c-pq{background:var(--c-pq);color:var(--surface);} .strip .cell.c-sg{background:var(--c-sg);color:var(--surface);}
  .strip .cell.split.c-hn-pq{background:linear-gradient(135deg, var(--c-hn) 50%, var(--c-pq) 50%);} .strip .cell.split.c-pq-hn{background:linear-gradient(135deg, var(--c-pq) 50%, var(--c-hn) 50%);}
  .strip .cell.split.c-hn-sg{background:linear-gradient(135deg, var(--c-hn) 50%, var(--c-sg) 50%);} .strip .cell.split.c-sg-hn{background:linear-gradient(135deg, var(--c-sg) 50%, var(--c-hn) 50%);}
  .strip .cell.split.c-pq-sg{background:linear-gradient(135deg, var(--c-pq) 50%, var(--c-sg) 50%);} .strip .cell.split.c-sg-pq{background:linear-gradient(135deg, var(--c-sg) 50%, var(--c-pq) 50%);}
  .strip .cell.split{color:var(--surface);background:var(--brand);}
  .strip-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0;}
  .dot.c-hn{background:var(--c-hn);} .dot.c-pq{background:var(--c-pq);} .dot.c-sg{background:var(--c-sg);}

  /* Trip setup */
  .leg{border:1px solid var(--line);border-left:5px solid var(--leg, var(--brand));border-radius:12px;padding:12px;margin-bottom:10px;background:var(--paper);display:flex;flex-direction:column;gap:8px;}
  .leg.c-hn{--leg:var(--c-hn);} .leg.c-pq{--leg:var(--c-pq);} .leg.c-sg{--leg:var(--c-sg);}
  .leg-top{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
  .fld{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .fld-l{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
  .fld input, .fld select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-height:40px;}
  .fld-grow{flex:1 1 160px;}
  .leg-rm{margin-left:auto;}
  .hint{font-size:12px;color:var(--ink-soft);}
  .err{font-size:13px;color:var(--lacquer);background:var(--lacquer-soft);border-radius:8px;padding:6px 10px;}
  .row-acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 8px;align-items:center;}
  .pin-st{font-size:13px;color:var(--ink-soft);}
  .pin-st.ok{color:var(--brand);font-weight:600;}
  .mini-map{height:220px;border-radius:10px;border:1px solid var(--line);overflow:hidden;}

  /* Timeline */
  .tl{list-style:none;margin:0;padding:0;}
  .tl-day{display:grid;grid-template-columns:64px 1fr;gap:0 14px;padding-bottom:6px;}
  .tl-day + .tl-day{border-top:1px solid var(--line);padding-top:14px;}
  .tl-date{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding-top:2px;}
  .tl-date .dow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .tl-date .dnum{font-family:'Literata', Georgia, serif;font-size:1.55rem;font-weight:600;color:var(--day, var(--brand));font-variant-numeric:lining-nums;}
  .tl-date .mon{font-size:12px;color:var(--ink-soft);}
  .tl-day.c-hn{--day:var(--c-hn);} .tl-day.c-pq{--day:var(--c-pq);} .tl-day.c-sg{--day:var(--c-sg);}
  .tl-city{font-size:12px;font-weight:700;color:var(--day, var(--brand));letter-spacing:.04em;text-transform:uppercase;margin:4px 0 8px;}
  .tl-events{list-style:none;margin:0;padding:0;}
  .ev{position:relative;display:grid;grid-template-columns:2.9rem 28px 1fr;gap:0 9px;padding-bottom:14px;}
  .ev:not(:last-child)::before{content:"";position:absolute;left:calc(2.9rem + 9px + 13px);top:30px;bottom:2px;width:2px;background:var(--line);border-radius:2px;}
  .ev-time{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;padding-top:5px;}
  .ev-time-none{color:var(--ink-soft);font-weight:400;}
  .ev-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:14px;}
  .ev-exc .ev-ic{background:var(--jade-soft);} .ev-food .ev-ic{background:var(--lacquer-soft);} .ev-bar .ev-ic{background:var(--wood-soft);} .ev-stay .ev-ic{background:var(--gold-soft);color:var(--gold);}
  .ev-body{min-width:0;padding-top:4px;}
  .ev-title{font-size:15px;font-weight:500;line-height:1.35;}
  .ev-title strong{font-weight:700;}
  .ev-meta{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
  .tl-empty{font-size:13.5px;color:var(--ink-soft);margin:2px 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .tl-day.is-today{background:color-mix(in srgb, var(--brand-soft) 60%, transparent);border-radius:12px;margin-inline:-8px;padding-inline:8px;}
  .today-badge{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--surface);background:var(--brand);border-radius:999px;padding:1px 7px;margin-bottom:3px;}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:4px;vertical-align:1px;}
  .badge-mi{color:var(--lacquer);background:var(--lacquer-soft);}
  .badge-star{color:var(--gold);background:var(--gold-soft);}
  .price{font-weight:600;color:var(--ink);}
  .price.unv{font-weight:400;font-style:italic;color:var(--ink-soft);}
  .note-mine{font-size:13px;color:var(--jade);font-weight:600;margin-top:3px;}

  /* Planner */
  .pl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;}
  .pl-status{font-size:12.5px;color:var(--brand);font-weight:600;}
  .pl-datebar{display:flex;gap:6px;align-items:stretch;margin:4px 0 12px;position:sticky;top:112px;z-index:3;background:var(--surface);padding:6px 0;}
  .pl-date{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;padding:9px 10px;border:2px solid var(--brand);border-radius:12px;background:var(--surface);color:var(--ink);}
  .pl-step{min-width:44px;justify-content:center;}
  .pl-day-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .pl-day-h .dnum{font-family:'Literata', Georgia, serif;font-size:1.25rem;font-weight:600;}
  .pl-city{font-size:12.5px;font-weight:700;color:var(--brand);}
  .pl-row{display:grid;grid-template-columns:6.4rem 1fr;gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);}
  .pl-label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);padding-top:9px;}
  .pl-ctl{min-width:0;display:flex;flex-direction:column;gap:6px;}
  .pick{border:1px solid var(--brand);border-radius:10px;padding:8px 10px;background:var(--surface);}
  .pick-top{display:flex;gap:8px;align-items:center;}
  .pick-name{flex:1;min-width:0;font-size:14px;font-weight:700;}
  .pick input[type=time]{flex:0 0 auto;width:6.4rem;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);}
  .pick-rm{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--lacquer);font-size:16px;cursor:pointer;}
  .pick-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .add-btn{align-self:flex-start;}
  .picker{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 10px 10px;max-height:min(60vh, 460px);overflow-y:auto;}
  .picker-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin:10px 0 4px;}
  .picker-h:first-child{margin-top:2px;}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.35;}
  .opt:hover{background:var(--brand-soft);}
  .opt input{width:20px;height:20px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--brand);}
  .opt-sub{display:block;font-size:12.5px;color:var(--ink-soft);}
  .picker-foot{position:sticky;bottom:-10px;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 2px;background:var(--paper);}
  .pl-warn{font-size:12.5px;color:var(--lacquer);background:var(--lacquer-soft);border-radius:8px;padding:6px 10px;margin:6px 0;}
  .pl-none{font-size:13.5px;color:var(--ink-soft);padding:8px 0;}
  details.box{border:1px solid var(--line);border-radius:12px;margin:14px 0 6px;background:var(--paper);}
  details.box > summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14px;}
  details.box > div{padding:0 14px 12px;}
  .mp-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
  .mp-meta{font-size:12.5px;color:var(--ink-soft);}
  .cf{border:1px solid var(--brand);border-radius:12px;padding:12px;margin-top:6px;background:var(--surface);display:flex;flex-direction:column;gap:8px;}
  .cf-h{font-weight:700;font-size:14px;}
  @media (max-width:560px){ .pl-row{grid-template-columns:1fr;} .pl-label{padding-top:0;} .tl-day{grid-template-columns:1fr;} .tl-date{flex-direction:row;align-items:baseline;gap:6px;margin-bottom:6px;} .tl-date .dnum{font-size:1.15rem;} .card{padding:16px 12px 8px;} .ev{grid-template-columns:2.7rem 26px 1fr;gap:0 8px;} .ev:not(:last-child)::before{left:calc(2.7rem + 8px + 12px);} }

  /* Map */
  .map-controls{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px;}
  .seg{display:inline-flex;gap:2px;background:var(--line);padding:3px;border-radius:999px;align-self:flex-start;flex-wrap:wrap;}
  .seg button{border:none;background:none;font:inherit;font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:999px;color:var(--ink-soft);cursor:pointer;min-height:36px;}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0 2px;}
  .chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:34px;}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--surface);}
  .chip .cnt{font-weight:500;margin-left:5px;}
  .map-opt{font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;}
  .map-opt label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer;}
  .map-opt input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--brand);}
  .map-opt select{font:inherit;font-size:14px;font-weight:600;padding:7px 10px;border:1px solid var(--brand);border-radius:10px;background:var(--surface);color:var(--ink);}
  .is-raster .leaflet-tile-pane{filter:saturate(.62) brightness(1.06) contrast(.92);}
  .leaflet-container{font-family:'Be Vietnam Pro', system-ui, sans-serif;}
  .map-box{height:420px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--paper);}
  .map-count, .map-msg{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .map-pin-wrap{background:none;border:none;}
  .map-pin{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--map-surface);border:2px solid var(--map-neutral);box-shadow:0 1px 4px rgb(0 0 0 / .3);color:var(--map-ink);font-size:13px;line-height:1;}
  .map-pin.pin-food{border-color:var(--map-gold);} .map-pin.pin-bar{border-color:var(--map-wood);} .map-pin.pin-exc{border-color:var(--map-palm);}
  .map-pin.pin-stay{border-color:var(--map-lacquer);background:var(--map-lacquer-soft);}
  .map-pin.is-planned{transform:scale(1.18);box-shadow:0 0 0 3px var(--map-brand), 0 2px 6px rgb(0 0 0 / .35);}
  .map-pin.pin-num{background:var(--map-brand);color:var(--map-surface);border-color:var(--map-surface);font-weight:700;font-size:12.5px;}
  .map-pin.pin-num.pin-stay{background:var(--map-gold);}
  .map-pop{min-width:190px;color:var(--map-ink);}
  .map-pop-t{font-weight:700;font-size:14px;margin-bottom:2px;}
  .map-pop-m{font-size:12.5px;color:var(--map-ink-soft);margin-bottom:2px;}
  .map-pop .act{min-height:28px;padding:4px 9px;font-size:12px;background:var(--map-surface);color:var(--map-brand);border-color:var(--map-line);}
  .route-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px;}
  .route-list li{display:flex;gap:8px;align-items:baseline;}
  .route-list .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--surface);font-size:12px;font-weight:700;}
  .route-list .n.stay{background:var(--gold);}
  .route-list .h{font-weight:700;font-variant-numeric:tabular-nums;min-width:3rem;}
  @media (max-width:560px){ .map-box{height:340px;} }

  /* Pointer bubbles (first-visit tips) */
  .tip{position:absolute;z-index:20;max-width:270px;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgb(0 0 0 / .3);font-size:14px;line-height:1.4;}
  .tip::before{content:"";position:absolute;top:-7px;left:var(--arrow, 24px);width:14px;height:14px;background:var(--ink);transform:rotate(45deg);border-radius:2px;}
  .tip-n{font-size:12px;opacity:.7;margin-bottom:3px;}
  .tip-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}
  .tip-acts button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:34px;}
  .tip-skip{background:none;border:1px solid color-mix(in srgb, var(--paper) 40%, transparent);color:var(--paper);}
  .tip-next{background:var(--paper);border:none;color:var(--ink);}

<script>
(function(){
  'use strict';
  // ---------- small helpers ----------
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(k, v){ try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch(e){} }
  function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function loadJSON(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function forget(k){ try { localStorage.removeItem(k); } catch(e){} }
  function own(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }
  function copyText(t){
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function(res, rej){
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); } finally { document.body.removeChild(ta); }
    });
  }
  document.addEventListener('click', function(ev){
    var btn = ev.target.closest('.copy-btn[data-copy]'); if (!btn) return;
    var addr = btn.getAttribute('data-copy');
    copyText(addr).then(function(){ btn.classList.add('copied'); setTimeout(function(){ btn.classList.remove('copied'); }, 1600); },
      function(){ window.prompt('Copy this address:', addr); });
  });

  // ---------- the app: runs after unlock, all place data comes from the decrypted fragment ----------
  var onMapShow = null;
  function initApp(frag){
    var D = JSON.parse(frag.querySelector('#vf-data').textContent);
    var infoEl = frag.querySelector('#vf-info');
    var FIRST = 1, LAST = 17;                                   // trip window: day 1 = 17 Dec 2026 ... day 17 = 2 Jan 2027
    var CITY = {hn: 'Hà Nội', pq: 'Phú Quốc', sg: 'Saigon'};
    var CITY_LONG = {hn: 'Hà Nội', pq: 'Phú Quốc', sg: 'Hồ Chí Minh City (Saigon)'};
    var CITIES = ['hn', 'pq', 'sg'];
    var CENTER = {hn: [[21.033, 105.85], 13], pq: [[10.23, 103.96], 11], sg: [[10.776, 106.70], 13]};
    var SLOTS = ['exc', 'bf', 'lunch', 'dinner', 'bar'];
    var SLOT = {exc: 'Activity', bf: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', bar: 'Coffee & bars'};
    var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    // Days are stored as an index (1..17) so plans and share links stay small; every label comes from the real date.
    function dateOf(d){ return new Date(2026, 11, 16 + d); }
    function dom(d){ return dateOf(d).getDate(); }
    function mon(d){ return MON[dateOf(d).getMonth()]; }
    function dm(d){ return dom(d) + ' ' + mon(d); }
    function span(a, b){ return mon(a) === mon(b) ? dom(a) + '–' + dm(b) : dm(a) + ' – ' + dm(b); }
    function dow(d){ return DOW[dateOf(d).getDay()]; }
    function dayLabel(d){ return dow(d) + ' ' + dm(d); }
    function mins(h){ var p = (h || '').split(':'); return p.length === 2 ? (+p[0]) * 60 + (+p[1]) : -1; }
    function safeUrl(u){ u = String(u || '').trim(); return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; }
    function okLL(ll){ return (Array.isArray(ll) && ll.length === 2 && isFinite(ll[0]) && isFinite(ll[1]) && ll[0] > 8 && ll[0] < 24 && ll[1] > 102 && ll[1] < 110) ? [+(+ll[0]).toFixed(6), +(+ll[1]).toFixed(6)] : null; }
    // The exact pin from a long Google Maps link (place page, @lat,lng, ?q=lat,lng) or a pasted "lat, lng"
    function pinFromLink(u){
      u = String(u || '');
      var m = u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
              u.match(/[?&](?:q|query|ll|destination|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i) || u.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
      return m ? okLL([+m[1], +m[2]]) : null;
    }
    function cityOfLL(ll){
      var best = null, bd = 1e9;
      CITIES.forEach(function(c){ var p = CENTER[c][0], d = Math.abs(ll[0] - p[0]) + Math.abs(ll[1] - p[1]); if (d < bd) { bd = d; best = c; } });
      return best;
    }

    // ---------- catalogue + custom places ----------
    var byId = {};
    function index(){ byId = {}; D.items.forEach(function(it){ byId[it.i] = it; }); }
    function sanitizeCustom(x){
      if (!x || typeof x !== 'object') return null;
      var tt = x.t === 'exc' || x.t === 'food' ? x.t : null;
      var n = String(x.n || '').trim().slice(0, 80);
      var it = {i: +x.i, c: CITIES.indexOf(x.c) >= 0 ? x.c : 'hn', t: tt, n: n, custom: true};
      if (!tt || !n || !(it.i >= 1000 && it.i < 100000)) return null;
      if (tt === 'food') it.k = own(D.foodCats, x.k) ? x.k : 'vn';
      if (tt === 'exc') it.d = own(D.excGroups, x.d) ? x.d : 'half';
      it.e = tt === 'food' ? D.foodCats[it.k][0] : '📌';
      var m = safeUrl(x.m), b = safeUrl(x.b), a = String(x.a || '').trim().slice(0, 160), ll = okLL(x.ll);
      if (m) it.m = m; if (b) it.b = b; if (a) it.a = a; if (ll) it.ll = ll;
      return it;
    }
    function compactCustom(it){ var o = {i: it.i, c: it.c, t: it.t, n: it.n}; ['k', 'd', 'm', 'b', 'a', 'll'].forEach(function(k){ if (it[k] != null) o[k] = it[k]; }); return o; }
    var customs = [];
    function setCustoms(list){ customs = list; D.items = D.items.filter(function(it){ return !it.custom; }).concat(customs); index(); }
    function saveCustoms(){ store('vf-custom', customs.map(compactCustom)); }
    setCustoms((function(){ var a = loadJSON('vf-custom'); return (Array.isArray(a) ? a : []).map(sanitizeCustom).filter(Boolean); })());
    function nextCustomId(){ var mx = 999; customs.forEach(function(c){ if (c.i > mx) mx = c.i; }); return mx + 1; }
    function emoji(it){ return it.e || (it.t === 'food' && D.foodCats[it.k] ? D.foodCats[it.k][0] : '📌'); }
    function group(it){ return it.t === 'exc' ? 'exc' : (it.k === 'bar' || it.k === 'cafe') ? 'bar' : 'food'; }

    // ---------- trip setup: legs = [{c, a: arrival day, d: departure day, n: stay, m: stay link, ll, f: flight note}] ----------
    function sanitizeLeg(x){
      if (!x || typeof x !== 'object' || CITIES.indexOf(x.c) < 0) return null;
      var a = Math.round(+x.a), d = Math.round(+x.d);
      if (!(a >= FIRST && a <= LAST && d >= a && d <= LAST)) return null;
      var l = {c: x.c, a: a, d: d}, n = String(x.n || '').trim().slice(0, 80), m = safeUrl(x.m), f = String(x.f || '').trim().slice(0, 60), ll = okLL(x.ll);
      if (n) l.n = n; if (m) l.m = m; if (f) l.f = f; if (ll) l.ll = ll;
      return l;
    }
    function checkTrip(legs){
      var errs = [];
      if (!legs.length) errs.push('Add at least one city.');
      var s = legs.slice().sort(function(x, y){ return x.a - y.a || x.d - y.d; });
      for (var k = 1; k < s.length; k++) {
        if (s[k].a < s[k - 1].d) errs.push(CITY[s[k - 1].c] + ' (' + span(s[k - 1].a, s[k - 1].d) + ') and ' + CITY[s[k].c] + ' (' + span(s[k].a, s[k].d) + ') overlap. The day you leave one city can be the day you arrive in the next, nothing more.');
      }
      return errs;
    }
    var trip = (function(){ var t = loadJSON('vf-trip'); var legs = (t && Array.isArray(t.legs) ? t.legs : []).map(sanitizeLeg).filter(Boolean); return legs.length && !checkTrip(legs).length ? {legs: legs} : null; })();
    function sortLegs(){ trip.legs.sort(function(x, y){ return x.a - y.a; }); }
    function saveTrip(){ store('vf-trip', trip); }
    // What a day looks like: which city each slot is in. A travel day (leave one city, arrive in the next):
    // breakfast and lunch in the old city, dinner and bar in the new one, no activity.
    function dayInfo(day){
      if (!trip) return null;
      var on = trip.legs.filter(function(l){ return l.a <= day && day <= l.d; });
      if (!on.length) return null;
      if (on.length === 1) {
        var l = on[0], sc = {}; SLOTS.forEach(function(s){ sc[s] = l.c; });
        return {day: day, c: l.c, sc: sc, legs: on};
      }
      var from = on[0], to = on[on.length - 1];
      return {day: day, c: to.c, from: from.c, sc: {bf: from.c, lunch: from.c, dinner: to.c, bar: to.c}, legs: on, travel: true};
    }
    function tripDays(){ var out = []; for (var d = FIRST; d <= LAST; d++) if (dayInfo(d)) out.push(d); return out; }
    function cityLabel(di){ return di.travel ? CITY[di.from] + ' → ' + CITY[di.c] : CITY[di.c]; }
    function tripCities(){ var out = []; (trip ? trip.legs : []).forEach(function(l){ if (out.indexOf(l.c) < 0) out.push(l.c); }); return out.length ? out : CITIES.slice(); }

    // ---------- plans: {day: {slot: [{i, h}]}}, several places per slot ----------
    function fits(sl, it, city){
      if (!it || it.c !== city) return false;
      if (sl === 'exc') return it.t === 'exc';
      if (it.t !== 'food') return false;
      return sl === 'bar' ? (it.k === 'bar' || it.k === 'cafe') : it.k !== 'bar';
    }
    function cleanPlans(p){
      var out = {};
      Object.keys(p || {}).forEach(function(day){
        var dn = +day; if (!(dn >= FIRST && dn <= LAST) || !p[day] || typeof p[day] !== 'object') return;
        SLOTS.forEach(function(sl){
          var arr = Array.isArray(p[day][sl]) ? p[day][sl] : [];
          var seen = {}, list = [];
          arr.slice(0, 12).forEach(function(v){
            var id = v && +v.i; if (!byId[id] || seen[id]) return; seen[id] = 1;
            list.push({i: id, h: (v && /^\d\d:\d\d$/.test(v.h)) ? v.h : D.times[sl]});
          });
          if (list.length) (out[dn] = out[dn] || {})[sl] = list;
        });
      });
      return out;
    }
    var plans = cleanPlans(loadJSON('vf-plan'));
    function savePlans(){ store('vf-plan', plans); }
    // Entries stay on their date when the trip changes; only those that fit the day's city now are shown
    function shown(day, sl){ var di = dayInfo(day), arr = (plans[day] || {})[sl] || []; if (!di || !di.sc[sl]) return []; return arr.filter(function(v){ return fits(sl, byId[v.i], di.sc[sl]); }); }
    function stale(day){
      var out = []; SLOTS.forEach(function(sl){ var ok = shown(day, sl); ((plans[day] || {})[sl] || []).forEach(function(v){ if (ok.indexOf(v) < 0) out.push({sl: sl, v: v}); }); });
      return out;
    }
    function setSlot(day, sl, list){
      if (list.length) { (plans[day] = plans[day] || {})[sl] = list; }
      else if (plans[day]) { delete plans[day][sl]; if (!Object.keys(plans[day]).length) delete plans[day]; }
      savePlans();
    }
    // A second place in the same slot starts an hour after the latest one, so times do not collide
    function nextTime(list, sl){
      if (!list.length) return D.times[sl];
      var m = Math.min(23 * 60 + 30, Math.max.apply(null, list.map(function(v){ return mins(v.h); })) + 60);
      return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + m % 60).slice(-2);
    }
    function dayCount(day){ var n = 0; SLOTS.forEach(function(sl){ n += shown(day, sl).length; }); return n; }
    function usedOn(id){ var out = []; tripDays().forEach(function(d){ SLOTS.forEach(function(sl){ shown(d, sl).forEach(function(v){ if (v.i === id && out.indexOf(d) < 0) out.push(d); }); }); }); return out; }
    // A 2-day excursion also fills the next day
    function spillFrom(day){
      var prev = day - 1; if (!dayInfo(prev)) return null;
      var hit = null; shown(prev, 'exc').forEach(function(v){ if (byId[v.i].d === '2d') hit = byId[v.i]; });
      return hit;
    }
    function warnings(day){
      var w = [], di = dayInfo(day), all = [];
      SLOTS.forEach(function(sl){ shown(day, sl).forEach(function(v){ all.push({sl: sl, v: v}); }); });
      shown(day, 'exc').forEach(function(v){
        if (byId[v.i].d !== '2d') return;
        var nx = dayInfo(day + 1);
        if (!nx || nx.travel || nx.c !== di.c) w.push(byId[v.i].n + ' takes 2 days, but the next day you are not in ' + CITY[di.c] + '.');
        else if (shown(day + 1, 'exc').length) w.push(byId[v.i].n + ' also takes the next day, where an activity is already planned.');
      });
      if (spillFrom(day) && shown(day, 'exc').length) w.push('This day is day 2 of ' + spillFrom(day).n + '.');
      var full = shown(day, 'exc').filter(function(v){ var d = byId[v.i].d; return d === 'full' || d === '2d'; });
      if (full.length > 1) w.push('Two full-day activities on the same day.');
      var ids = {}; all.forEach(function(x){ if (ids[x.v.i]) w.push(byId[x.v.i].n + ' is in the plan twice this day.'); ids[x.v.i] = 1; });
      var s = all.slice().sort(function(a, b){ return mins(a.v.h) - mins(b.v.h); });
      for (var k = 1; k < s.length; k++) if (mins(s[k].v.h) - mins(s[k - 1].v.h) < 30) w.push(s[k - 1].v.h + ' ' + byId[s[k - 1].v.i].n + ' and ' + s[k].v.h + ' ' + byId[s[k].v.i].n + ' are less than 30 minutes apart.');
      return w;
    }

    // ---------- share link: trip + plan + own places in the URL fragment (never sent to a server) ----------
    function encode(){
      var e = [];
      Object.keys(plans).forEach(function(day){ SLOTS.forEach(function(sl, si){ ((plans[day] || {})[sl] || []).forEach(function(v){ e.push([+day, si, v.i, +v.h.replace(':', '')]); }); }); });
      var payload = {v: 1, t: trip ? trip.legs : [], p: e};
      if (customs.length) payload.c = customs.map(compactCustom);
      return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function decode(str){
      var j = JSON.parse(decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/')))));
      if (!j || typeof j !== 'object' || j.v !== 1) throw new Error('unknown link');
      var p = Object.create(null);  // a "__proto__" day key stays an own key instead of reaching Object.prototype
      (Array.isArray(j.p) ? j.p : []).slice(0, 400).forEach(function(x){
        if (!Array.isArray(x)) return;
        var sl = SLOTS[x[1]]; if (!sl) return;
        var h = ('0' + Math.floor(x[3] / 100)).slice(-2) + ':' + ('0' + x[3] % 100).slice(-2);
        var day = String(x[0]); p[day] = p[day] || Object.create(null); (p[day][sl] = p[day][sl] || []).push({i: x[2], h: h});
      });
      var legs = (Array.isArray(j.t) ? j.t : []).slice(0, 10).map(sanitizeLeg).filter(Boolean);
      return {legs: legs, p: p, c: Array.isArray(j.c) ? j.c.slice(0, 50).map(sanitizeCustom).filter(Boolean) : []};
    }
    var hm = location.hash.match(/^#plan=([A-Za-z0-9_-]+)$/);
    if (hm) {
      try {
        var got = decode(hm[1]);
        if (confirm('Load the trip and plan from this link? What is on this phone now will be replaced.')) {
          setCustoms(got.c); saveCustoms();
          if (got.legs.length && !checkTrip(got.legs).length) { trip = {legs: got.legs}; sortLegs(); saveTrip(); }
          plans = cleanPlans(got.p); savePlans();
        }
      } catch(e){ alert('This plan link is broken or from an older version.'); }
      history.replaceState(null, '', location.pathname + location.search);
    }
    function shareLink(){
      var url = location.origin + location.pathname + '#plan=' + encode();
      if (navigator.share) navigator.share({title: 'Our Vietnam plan', url: url}).catch(function(){});
      else copyText(url).then(function(){ flash('Link copied. Send it only to the three of you.'); }, function(){ window.prompt('Copy the link:', url); });
    }

    // ---------- shared bits of UI ----------
    function actLink(box, href, ico, txt){ var x = el('a', 'act'); x.href = href; x.target = '_blank'; x.rel = 'noopener'; x.append(el('span', null, ico), el('span', null, ' ' + txt)); box.appendChild(x); }
    function actCopy(box, addr){
      var cb = el('button', 'act copy-btn'); cb.type = 'button'; cb.dataset.copy = addr; cb.title = 'Copy the address for Grab';
      var lbl = el('span', 'lbl', '⧉ Copy address'), done = el('span', 'done', '✓ Copied'); cb.append(lbl, done); box.appendChild(cb);
    }
    function links(it){
      var box = el('div', 'ev-actions');
      if (it.m) actLink(box, it.m, '📍', 'Map');
      if (it.a) actCopy(box, it.a);
      if (it.b) actLink(box, it.b, '↗', 'Book');
      (it.x || []).forEach(function(x){ actLink(box, x[2], x[0], x[1]); });
      return box;
    }
    function badges(it){
      var box = el('div', 'pick-meta');
      if (it.s) box.appendChild(el('span', 'badge badge-star', '⭐ Marius'));
      if (it.mi) box.appendChild(el('span', 'badge badge-mi', 'Michelin ' + it.mi));
      if (it.t === 'food' && !it.custom) {
        var pr = it.p ? (it.pu ? it.p + ' · price unverified' : it.p) : 'price unverified';
        box.appendChild(el('span', 'price' + (it.pu || !it.p ? ' unv' : ''), pr));
      }
      if (it.en) box.appendChild(document.createTextNode((box.childNodes.length ? ' · ' : '') + it.en));
      if (it.ax) box.appendChild(document.createTextNode(' · pin approximate'));
      return box;
    }
    function stayLinks(l){
      var box = el('div', 'ev-actions');
      if (l.m) actLink(box, l.m, '📍', 'Map');
      if (l.n) actCopy(box, l.n + ', ' + CITY_LONG[l.c]);
      return box.childNodes.length ? box : null;
    }
    var statusMsg = null;
    function flash(m){ statusMsg = m; renderPlanner(); setTimeout(function(){ if (statusMsg === m) { statusMsg = null; renderPlanner(); } }, 4000); }

    // Pin chooser for a stay or an own place: long Google link → pin, else tap on a small map
    function pinField(state, city, onPin){
      var wrap = el('div', 'fld');
      var st = el('div', 'pin-st'), btn = el('button', 'act', '📍 Place on map'); btn.type = 'button';
      var mini = el('div', 'mini-map'); mini.hidden = true;
      var mm = null, mk = null;
      function show(){
        st.className = 'pin-st' + (state.ll ? ' ok' : '');
        st.textContent = state.ll ? '📍 Pin set ✓' + (cityOfLL(state.ll) !== city() ? ' ⚠ it looks like another city' : '')
          : (state.m ? 'This link has no pin (short link?). Use "Place on map".' : 'No pin yet: paste a long Google Maps link or use "Place on map".');
      }
      function marker(){ if (!mm || !state.ll) return; if (mk) mk.setLatLng(state.ll); else mk = L.marker(state.ll).addTo(mm); }

  var PRIVATE_ITER = 300000; // keep identical to ITERATIONS in tools/encrypt_private.py
  var card = document.getElementById('unlock-card'), form = card.querySelector('.unlock');
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function norm(c){ return (c || '').replace(/[\s-]/g, '').toLowerCase(); }
  function decrypt(code){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(norm(code)), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){ return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(PRIVATE.s), iterations: PRIVATE_ITER, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']); })
      .then(function(key){ return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(PRIVATE.i)}, key, b64(PRIVATE.c)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function reveal(htmlText){
    var tpl = document.createElement('template'); tpl.innerHTML = htmlText.trim();
    card.hidden = true; tabs.hidden = false; shareBtn.hidden = false;
    app = initApp(tpl.content);
    if (!app.hasTrip()) { app.openSetup(); return; }
    setView(load('vf-view') || 'itin');
    app.startTips(false);
  }
  function msg(t){ form.querySelector('.unlock-msg').textContent = t; }
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (!PRIVATE) { msg('The trip details are not published yet.'); return; }
    if (!window.crypto || !crypto.subtle) { msg('This browser cannot unlock the page here (it needs HTTPS).'); return; }
    var code = form.querySelector('input').value;
    msg('Checking…');
    decrypt(code).then(function(t){ store('vf-code', norm(code)); reveal(t); }, function(){ msg('Wrong code. Check it, or ask Marius.'); });
  });
  // A plan link opened while the page is already open only changes the hash: reload so it is read
  window.addEventListener('hashchange', function(){ if (/^#plan=/.test(location.hash)) location.reload(); });
  var savedCode = load('vf-code');
  if (savedCode && PRIVATE && window.crypto && crypto.subtle) decrypt(savedCode).then(reveal, function(){ forget('vf-code'); });
})();
